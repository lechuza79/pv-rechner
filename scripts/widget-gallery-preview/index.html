<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energie-Widgets · Solar Check</title>
<style>
:root{--ink:#173b42;--muted:#63757b;--paper:#f4f6f1;--line:#d4ddda;--accent:#d6ff00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px 32px 80px}.brand{font-weight:750;letter-spacing:-.04em;font-size:23px}header{margin:44px 0 28px}h1{font-size:clamp(36px,5vw,64px);letter-spacing:-.045em;line-height:1.05;margin:0 0 18px}p{color:var(--muted);margin:0}header p{font-size:19px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:28px 0 34px}input,select,button{font:inherit;color:inherit}input{border:1px solid var(--line);border-radius:40px;padding:12px 20px;background:transparent;min-width:250px}button{border:1px solid var(--line);border-radius:30px;padding:10px 18px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.count{margin-left:auto;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 28px;align-items:start}article{min-width:0}.preview{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:white;position:relative;min-height:200px}iframe{border:0;display:block;width:100%;height:480px;background:transparent}.caption{display:flex;align-items:flex-start;gap:12px;margin:15px 4px 0}.caption h2{font-size:19px;font-weight:650;line-height:1.3;margin:0}.caption p{font-size:13px;margin-top:5px}.caption a{margin-left:auto;text-decoration:none;font-size:21px;color:var(--ink);padding:0 6px}.caption select{max-width:180px;font-size:13px;padding:5px;border:1px solid var(--line);border-radius:8px;background:transparent}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}.loaded .placeholder{display:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:4px}.remaining{margin-top:48px;border-top:1px solid var(--line);padding-top:24px;color:var(--muted)}.remaining a{color:inherit;margin-right:24px}.empty{padding:40px} @media(max-width:700px){main{padding:24px 16px 48px}header{margin-top:32px}.grid{grid-template-columns:1fr;gap:32px}.toolbar{gap:8px}.toolbar input{width:100%;min-width:0}.count{width:100%;margin:8px 0 0}.preview{border-radius:18px}.caption{flex-wrap:wrap}.caption h2{font-size:17px}}
</style>
<main><div class="brand">solar-check.io</div><header><h1>Energie sichtbar machen.</h1><p>Unsere Widgets. Direkt ausprobieren.</p></header>
<div class="toolbar"><input id="search" type="search" aria-label="Widgets suchen" placeholder="Widget suchen"><button data-filter="all" aria-pressed="true">Alle</button><button data-filter="regional" aria-pressed="false">Vor Ort</button><button data-filter="energy" aria-pressed="false">Energie & Ausbau</button><button data-filter="cost" aria-pressed="false">Kosten & Rechner</button><span class="count" id="count" aria-live="polite"></span></div><div class="grid" id="grid"></div><div class="remaining" id="remaining"></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const singles=new Set(['regional-current-power','regional-annual-growth','regional-composition','gemeinde-anlagenraster','regional-electricity-value','regional-feed-in-value','gemeinde-energie-jahr','gemeinde-solar-monat']);
const order=['gemeinde-ranking','regional-annual-growth','gemeinde-solar-monat','regional-race','regional-composition','gemeinde-anlagenraster','gemeinde-energie-jahr','regional-electricity-value','regional-feed-in-value','regional-current-power'];
function variants(w){if(singles.has(w.id)||['gemeinde-ranking','solar-trend-monat'].includes(w.id))return[{label:'Nidda',url:'http://127.0.0.1:4319/embed/galerie/'+w.id}];if(w.id==='regional-race')return[{label:'Wetteraukreis',url:'https://solar-check.io/embed/regional-race/06440'}];if(w.id==='gemeinde-meldung')return[{label:'Nidda',url:'https://solar-check.io/embed/gemeinde/06440016/insights'}];return w.variants;}
function group(w){return /gemeinde|regional|region-/.test(w.id)?'regional':/kosten|heiz|gruengas|rechner|simulation|foerder/.test(w.id)?'cost':'energy'}
let filter='all',entries=[],observer;
function mount(box){const iframe=document.createElement('iframe');iframe.title=box.dataset.title;iframe.src=box.dataset.src;iframe.addEventListener('load',()=>box.classList.add('loaded'));box.append(iframe);}
window.addEventListener('message',e=>{if(e.data?.type!=='widget:height'&&e.data?.type!=='municipal-data-layout')return;const frame=[...document.querySelectorAll('iframe')].find(f=>f.contentWindow===e.source);if(!frame||new URL(frame.src).origin!==e.origin)return;const h=Number(e.data.height);if(Number.isFinite(h)&&h>50&&h<15000)frame.style.height=Math.ceil(h)+'px';});
function render(){observer?.disconnect();const q=document.querySelector('#search').value.toLocaleLowerCase('de');const list=entries.filter(w=>variants(w).length&&(filter==='all'||group(w)===filter)&&[w.title,w.id].join(' ').toLocaleLowerCase('de').includes(q));document.querySelector('#count').textContent=list.length+' Widgets';document.querySelector('#grid').innerHTML=list.map(w=>{const vs=variants(w);return `<article><div class="preview" data-title="${esc(w.title)}" data-src="${esc(vs[0].url)}"><span class="placeholder">Widget wird geladen …</span></div><div class="caption"><div><h2>${esc(w.title)}</h2>${group(w)==='regional'?'<p>'+esc(vs[0].label)+'</p>':''}</div>${vs.length>1?'<select aria-label="Variante für '+esc(w.title)+'">'+vs.map(v=>'<option value="'+esc(v.url)+'">'+esc(v.label)+'</option>').join('')+'</select>':''}<a href="${esc(vs[0].url)}" target="_blank" rel="noopener" aria-label="${esc(w.title)} groß öffnen">↗</a></div></article>`}).join('')||'<p class="empty">Keine Widgets gefunden.</p>';observer=new IntersectionObserver(items=>items.forEach(item=>{if(item.isIntersecting){mount(item.target);observer.unobserve(item.target)}}),{rootMargin:'250px'});document.querySelectorAll('.preview').forEach(el=>observer.observe(el));document.querySelectorAll('.caption select').forEach(select=>select.addEventListener('change',()=>{const article=select.closest('article'),box=article.querySelector('.preview');box.querySelector('iframe')?.remove();box.dataset.src=select.value;box.classList.remove('loaded');article.querySelector('a').href=select.value;mount(box)}));}
fetch('./inventory.json').then(r=>r.json()).then(d=>{entries=d.entries.sort((a,b)=>(order.includes(a.id)?order.indexOf(a.id):-1+100)-(order.includes(b.id)?order.indexOf(b.id):-1+100));render();const remaining=entries.filter(w=>!variants(w).length);document.querySelector('#remaining').innerHTML='<details><summary>Noch ohne Einzelvorschau ('+remaining.length+')</summary>'+remaining.map(w=>'<a target="_blank" rel="noopener" href="'+esc(w.sourcePage)+'">'+esc(w.title)+' ↗</a>').join('')+'</details>';});
document.querySelector('#search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
</script></html>
