name: MaStR Refresh

# Pulls the BNetzA Gesamtdatenexport (monthly XML dump), aggregates per
# region × energy type × segment × year, and upserts into Supabase. Replaces
# the older quarterly Zenodo pipeline; the BNetzA dump refreshes daily and
# is the authoritative source. The Zenodo path (scripts/mastr-refresh.ts)
# stays in the repo as a fallback if BNetzA ever goes down.
#
# Vercel cron is unsuitable here — Function timeout is too short and the
# 3 GB download exceeds Edge limits. GitHub Actions runners have ~14 GB
# free disk; the job budget is 120 min (the June 2026 run was cancelled at
# the old 60 min limit — download + aggregate + upload of the growing dump no
# longer fits in an hour, so the last successful data stayed at May).

on:
  schedule:
    # 04:00 UTC am 5., 7. und 9. jedes Monats. UTC haelt den Plan an der eigenen
    # Veroeffentlichungszeit der Behoerde (~05:00 UTC); am 5. sind die Zahlen
    # zum Monatsanfang stabil.
    #
    # DIE ZWEI NACHHOL-TERMINE SIND DER GRUND DIESER DATEI-AENDERUNG (09.09.2026):
    # Am 05.09. war der Server der Behoerde vom Laeufer aus nicht erreichbar, der
    # Lauf war nach 26 Sekunden rot — und danach versuchte es einen Monat lang
    # niemand mehr. Der Atlas zeigte vier Tage lang die Zahlen des Vormonats,
    # bemerkt hat es ein Mensch, zufaellig.
    #
    # Sie kosten fast nichts: Der Lauf am 7. und 9. traegt `--nur-wenn-faellig`
    # und hoert nach einer Datenbank-Abfrage auf, wenn der 5. geglueckt ist.
    # Der Zeitplan ist zugleich die QUELLE fuer das Urteil des Gesundheitschecks
    # ("ist ein Import ausgefallen?") — er liest die Tage hier heraus, statt sie
    # ein zweites Mal zu fuehren.
    - cron: "0 4 5,7,9 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mastr-refresh
  cancel-in-progress: false  # never interrupt an in-flight upsert

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # "true", wenn dieser Lauf wirklich importiert hat. Die Folgejobs haengen
      # daran: Ein uebersprungener Nachhol-Termin darf nicht 11.000 Seiten fuer
      # ungueltig erklaeren und zwei Stunden lang neu aufwaermen.
      getan: ${{ steps.faellig.outputs.getan }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Disk space before run
        run: df -h .

      # Ein Nachhol-Termin, dessen Vorgaenger geglueckt ist, hoert hier auf statt
      # 3,2 GB zu laden. Ein Lauf von Hand (workflow_dispatch) arbeitet immer —
      # wer ihn ansteuert, will genau das.
      #
      # Bei jedem Zweifel wird GEARBEITET (Datenbank nicht erreichbar, Zeitplan
      # nicht lesbar): Ein ueberfluessiger Lauf kostet eine halbe Stunde, ein
      # faelschlich uebersprungener kostet einen Monat Daten.
      - name: Ist der Import faellig?
        id: faellig
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "getan=true" >> "$GITHUB_OUTPUT"
          elif [ "$(npm run --silent mastr:refresh-bnetza -- --faellig-pruefen | tail -n1)" = "nein" ]; then
            echo "Bestand ist bereits aus diesem Zyklus — nichts zu tun."
            echo "getan=false" >> "$GITHUB_OUTPUT"
          else
            echo "getan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run MaStR refresh (BNetzA, full pipeline)
        if: steps.faellig.outputs.getan == 'true'
        run: npm run mastr:refresh-bnetza -- --download --aggregate --upload

      # Prueft die frisch hochgeladenen Zahlen gegen physikalische und
      # rechtliche Grenzen. Faellt sie durch, wird der Lauf rot — besser eine
      # rote Action als stillschweigend falsche Zahlen auf 11.000 Seiten.
      # Hintergrund im Skript selbst (der Fall Dolgesheim, 29.07.2026).
      - name: Plausibilitaet der aggregierten Daten
        if: steps.faellig.outputs.getan == 'true'
        run: npx tsx scripts/mastr-plausibilitaet.ts

      - name: Disk space after run
        if: always()
        run: df -h .

      - name: Upload artifacts (schema + aggregates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastr-bnetza-snapshot
          path: |
            scripts/mastr-bnetza-schema.json
            scripts/.cache/bnetza/aggregates.json
            scripts/.cache/bnetza/resolved.json
          if-no-files-found: warn
          retention-days: 90

  # Nach dem Datenlauf alle Atlas-Seiten fuer ungueltig erklaeren, DANN aufwaermen.
  #
  # Die Reihenfolge ist nicht vertauschbar, und der erste Schritt ist seit dem
  # 26.08.2026 neu — vorher verliess sich das Aufwaermen darauf, dass die Seiten
  # nach 24 Stunden ohnehin verfallen waren. Das stimmte, war aber teuer: Die
  # Daten kommen einmal im Monat, die Seiten verfielen dreissigmal oefter, und
  # jeder Verfall kostet einen kompletten Neuaufbau samt Datenbank-Abfragen.
  #
  # Sobald die Haltbarkeit auf den Datentakt steht, traefe der Aufwaermlauf
  # lauter noch gueltige Seiten und ruehrte sie nicht an — auf 11.000 Seiten
  # stuenden die Zahlen des Vormonats. Das Ungueltig-Erklaeren ist deshalb keine
  # Optimierung, sondern die Bedingung dafuer, dass die neuen Zahlen ueberhaupt
  # sichtbar werden.
  #
  # Dass es NACH der Plausibilitaetspruefung laeuft (die im Job `refresh` steckt
  # und ihn rot macht, wenn die Zahlen durchfallen), ist Absicht — aber es leistet
  # WENIGER, als hier zunaechst stand. Die Formulierung "erst wenn die Zahlen die
  # Pruefung bestanden haben, duerfen sie sichtbar werden" war falsch: Der Schritt
  # davor hat sie da laengst in die Datenbank geschrieben. Faellt die Pruefung
  # durch, wird zwar nicht invalidiert — aber jede Seite, deren Eintrag von selbst
  # ablaeuft, zeigt die ungeprueften Zahlen trotzdem. Die Reihenfolge steuert also
  # nur, WIE SCHNELL sie sichtbar werden, nicht OB. Wer das wirklich verhindern
  # will, muss den Upload selbst hinter die Pruefung legen.
  invalidate:
    needs: refresh
    if: needs.refresh.outputs.getan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Atlas-Seiten fuer ungueltig erklaeren
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          antwort=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://solar-check.io/api/atlas/revalidate)
          code=$(echo "$antwort" | tail -n1)
          echo "$antwort" | sed '$d'
          # Schlaegt das fehl, MUSS der Lauf rot werden: Ein stiller Fehlschlag
          # hiesse, dass der Aufwaermlauf gleich die alten Seiten bestaetigt und
          # die neuen Zahlen einen Monat lang unsichtbar bleiben.
          if [ "$code" != "200" ]; then
            echo "::error::Ungueltig-Erklaeren fehlgeschlagen (HTTP $code) — die neuen Zahlen wuerden nicht sichtbar."
            exit 1
          fi

  # Aufwaermen: baut die soeben fuer ungueltig erklaerten Seiten gedrosselt neu
  # auf, damit der erste echte Besucher eine fertige Seite bekommt statt den
  # Neuaufbau zu bezahlen. Die Drosselung schont die Supabase-Instanz.
  warm:
    needs: invalidate
    runs-on: ubuntu-latest
    # ~11k Gemeinden gedrosselt (~2 req/s) = gut 1,5–2 h; großzügig gedeckelt.
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Warm atlas pages (throttled)
        run: npm run atlas:warm
