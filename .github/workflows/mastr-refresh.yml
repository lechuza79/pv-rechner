name: MaStR Refresh

# Pulls the BNetzA Gesamtdatenexport (monthly XML dump), aggregates per
# region × energy type × segment × year, and upserts into Supabase. Replaces
# the older quarterly Zenodo pipeline; the BNetzA dump refreshes daily and
# is the authoritative source. The Zenodo path (scripts/mastr-refresh.ts)
# stays in the repo as a fallback if BNetzA ever goes down.
#
# Vercel cron is unsuitable here — Function timeout is too short and the
# 3 GB download exceeds Edge limits. GitHub Actions runners have ~14 GB
# free disk; the job budget is 120 min (the June 2026 run was cancelled at
# the old 60 min limit — download + aggregate + upload of the growing dump no
# longer fits in an hour, so the last successful data stayed at May).

on:
  schedule:
    # 04:00 UTC on the 5th of each month — BNetzA publishes daily, so by the
    # 5th the start-of-month data is stable. UTC keeps the schedule aligned
    # with BNetzA's own publication time (~05:00 UTC).
    - cron: "0 4 5 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mastr-refresh
  cancel-in-progress: false  # never interrupt an in-flight upsert

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Disk space before run
        run: df -h .

      - name: Run MaStR refresh (BNetzA, full pipeline)
        run: npm run mastr:refresh-bnetza -- --download --aggregate --upload

      # Prueft die frisch hochgeladenen Zahlen gegen physikalische und
      # rechtliche Grenzen. Faellt sie durch, wird der Lauf rot — besser eine
      # rote Action als stillschweigend falsche Zahlen auf 11.000 Seiten.
      # Hintergrund im Skript selbst (der Fall Dolgesheim, 29.07.2026).
      - name: Plausibilitaet der aggregierten Daten
        run: npx tsx scripts/mastr-plausibilitaet.ts

      - name: Disk space after run
        if: always()
        run: df -h .

      - name: Upload artifacts (schema + aggregates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastr-bnetza-snapshot
          path: |
            scripts/mastr-bnetza-schema.json
            scripts/.cache/bnetza/aggregates.json
            scripts/.cache/bnetza/resolved.json
          if-no-files-found: warn
          retention-days: 90

  # Nach dem Datenlauf alle Atlas-Seiten fuer ungueltig erklaeren, DANN aufwaermen.
  #
  # Die Reihenfolge ist nicht vertauschbar, und der erste Schritt ist seit dem
  # 26.08.2026 neu — vorher verliess sich das Aufwaermen darauf, dass die Seiten
  # nach 24 Stunden ohnehin verfallen waren. Das stimmte, war aber teuer: Die
  # Daten kommen einmal im Monat, die Seiten verfielen dreissigmal oefter, und
  # jeder Verfall kostet einen kompletten Neuaufbau samt Datenbank-Abfragen.
  #
  # Sobald die Haltbarkeit auf den Datentakt steht, traefe der Aufwaermlauf
  # lauter noch gueltige Seiten und ruehrte sie nicht an — auf 11.000 Seiten
  # stuenden die Zahlen des Vormonats. Das Ungueltig-Erklaeren ist deshalb keine
  # Optimierung, sondern die Bedingung dafuer, dass die neuen Zahlen ueberhaupt
  # sichtbar werden.
  #
  # Dass es NACH der Plausibilitaetspruefung laeuft (die im Job `refresh` steckt
  # und ihn rot macht, wenn die Zahlen durchfallen), ist Absicht: Erst wenn die
  # frischen Zahlen die Pruefung bestanden haben, duerfen sie sichtbar werden.
  invalidate:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Atlas-Seiten fuer ungueltig erklaeren
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          antwort=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://solar-check.io/api/atlas/revalidate)
          code=$(echo "$antwort" | tail -n1)
          echo "$antwort" | sed '$d'
          # Schlaegt das fehl, MUSS der Lauf rot werden: Ein stiller Fehlschlag
          # hiesse, dass der Aufwaermlauf gleich die alten Seiten bestaetigt und
          # die neuen Zahlen einen Monat lang unsichtbar bleiben.
          if [ "$code" != "200" ]; then
            echo "::error::Ungueltig-Erklaeren fehlgeschlagen (HTTP $code) — die neuen Zahlen wuerden nicht sichtbar."
            exit 1
          fi

  # Aufwaermen: baut die soeben fuer ungueltig erklaerten Seiten gedrosselt neu
  # auf, damit der erste echte Besucher eine fertige Seite bekommt statt den
  # Neuaufbau zu bezahlen. Die Drosselung schont die Supabase-Instanz.
  warm:
    needs: invalidate
    runs-on: ubuntu-latest
    # ~11k Gemeinden gedrosselt (~2 req/s) = gut 1,5–2 h; großzügig gedeckelt.
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Warm atlas pages (throttled)
        run: npm run atlas:warm
