name: Förder-Seiten-Wächter

# Ruft täglich die Amtsseiten aller Förderprogramme ab und vergleicht den
# sichtbaren Text mit dem letzten Stand.
#
# WARUM ALS ACTION UND NICHT ALS SCHEDULED TASK: Die inhaltlichen Wächter laufen
# als scheduled tasks auf dem Rechner des Betreibers — also nur, wenn der an und
# die App offen ist. In der Urlaubswoche (09.–13.08.2026) lief fünf Tage keiner,
# und niemand hat es bemerkt. Dieser Lauf braucht weder Rechner noch Modell: Er
# ruft ab und vergleicht Prüfsummen. Damit ist wenigstens die Frage „hat sich an
# einer Amtsseite etwas bewegt?" zuverlässig beantwortet, unabhängig davon, ob
# irgendjemand oder irgendetwas sonst läuft.
#
# WAS ER NICHT LEISTET: Er versteht nicht, WAS sich geändert hat, und er liest
# nichts. Er findet Förderseiten und sortiert sie vor; ob dort wirklich eine
# Förderung steht und mit welchen Sätzen, entscheidet erst ein Mensch, der die
# Amtsseite gelesen hat. Drei Stufen, jede enger als die vorige.
#
# Ein grüner Lauf heißt „nichts hat sich bewegt", nicht „alles korrekt" — wer das
# verwechselt, hat wieder ein Monitoring, das Schweigen für Bestätigung hält.
#
# Der Lauf wird NICHT rot, wenn er etwas findet. Eine geänderte Amtsseite ist
# kein Fehler, sondern Arbeit: Das Programm steht danach oben im Arbeitsvorrat
# (npm run foerder:probe -- --vorrat), den der nächste Förder-Wächter abarbeitet.
# Rot wäre hier eine Warnung, die bei jedem zweiten Lauf angeht — und damit eine,
# die man wegfiltert.

on:
  schedule:
    # Täglich früh, vor den scheduled tasks des Betreibers: Findet der Crawler
    # etwas, liegt es schon im Arbeitsvorrat, wenn dessen Lauf startet.
    - cron: "40 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: foerder-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 35 → 60 Minuten (23.08.2026). Das ist AUSDRÜCKLICH kein Hochsetzen einer
    # Schwelle, damit ein Befund verschwindet — der Befund IST, dass die Arbeit
    # gewachsen ist: Der Seitenbestand ging von 2.672 (19.08.) auf 6.922
    # (23.08.), und der letzte grüne Lauf am 19.08. brauchte 4 Minuten für das,
    # wofür heute die Zeit nicht mehr reicht. Actions-Minuten sind für dieses
    # öffentliche Repo kostenlos; die 35 waren nie eine Kostengrenze, sondern
    # eine Notbremse aus einer Zeit mit einem Viertel des Bestands.
    #
    # Gemessen am Lauf vom 23.08.2026 (Job 04:20:22–04:55:40):
    #   Setup + npm ci      ~2 min
    #   Amtsseiten          04:20 → 04:27   7 min   ← kritisch, kein Schrittlimit
    #   Suche               04:27 → 04:39  12 min   ← abschneidbar
    #   AGS + bekannte S.   04:39 → 04:47   8 min   ← kritisch (14-Tage-Frist)
    #   jede einzelne Seite 04:47 → 04:55   8 min   ← abschneidbar, riss den Job
    # Mit den Schrittlimits unten bleiben von 60 Minuten rund 19 für die
    # Schritte am Ende — Technik, Bericht, Screening, Leseliste. Genau die sind
    # vier Tage lang ausgefallen, weil sie hinten stehen und vorne jemand alles
    # aufgebraucht hat.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Amtsseiten abrufen und vergleichen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Damit der Runner unsere eigene Produktion als Ausgangspunkt nutzen
          # kann, wenn er selbst von einer Amtsseite abgewiesen wird.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run foerder:watch

      - name: Arbeitsvorrat zeigen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:probe -- --vorrat

      # Erst suchen, dann screenen — die Reihenfolge ist der Punkt. Was die Suche
      # findet, schreibt sie nach kommunen_kontakt.thema_foerderung_url; das
      # Screening im nächsten Schritt bedient sich genau aus diesem Feld. Eine
      # heute gefundene Förderseite ist damit im selben Lauf eingeordnet, statt
      # auf einen zweiten Tag zu warten.
      #
      # Für rund 9.700 Gemeinden kennen wir die Verwaltungs-Website, aber keine
      # Themenseite — das ist die größte Lücke im Katalog, und keine Menge
      # Screening kann sie schließen. Gemessen am ersten Lauf (18.08.2026):
      # 250 Gemeinden durchsucht, 113 Förderseiten gefunden.
      #
      # UMFANG AUF 1.000 GEZOGEN (19.08.2026), weil der Lauf einmal komplett von
      # vorn muss: Die Suche kann seit heute auch die Volltextsuche der Website
      # selbst benutzen (SUCH_VERSION 2), und die 7.863 Gemeinden mit Verdikt
      # „keine-seite" wurden mit der alten, flacheren Reichweite geprüft. Bei 300
      # je Nacht dauerte der Neudurchlauf über einen Monat, bei 1.000 rund zehn
      # Nächte.
      #
      # Die Rücksicht bleibt gewahrt, und zwar an der Stelle, auf die es
      # ankommt: Der Umfang sagt nichts über die Last je Server. Sechs Arbeiter
      # laufen auf sechs VERSCHIEDENEN Gemeinden, und jede einzelne Website
      # bekommt gemessene 2,9 Anfragen — unabhängig davon, ob der Lauf 300 oder
      # 1.000 Gemeinden abarbeitet. Was steigt, ist allein unsere eigene
      # Laufzeit (grob eine Viertelstunde).
      # Eigenes Zeitlimit aus demselben Grund wie unten beim Seiten-Abgleich: Der
      # Schritt ist fortschreitend gebaut und darf abgeschnitten werden, aber er
      # darf die Schritte danach nicht mitreißen. Am 23.08.2026 brauchte er 12
      # der 35 Minuten — der zweitgrößte Posten im Lauf und einer, der mit der
      # Zahl der Gemeinden weiterwächst.
      - name: Förderseiten auf den Amtsdomains suchen
        timeout-minutes: 12
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:suche -- --limit 1000

      # Zeigt jedes Programm auf die richtige Gemeinde? Ein vertippter
      # Gemeindeschlüssel bleibt gültig und zeigt auf einen anderen Ort — nichts
      # fällt um, nur bekommt die falsche Gemeinde die Förderung angeboten.
      # Gemessen am 19.08.2026: sechs von 43 neuen Programmen und ein
      # Altbestand (Bad Homburg hing an Glashütten). Dieser Schritt DARF rot
      # werden; er braucht kein Urteil, sondern vergleicht nur Namen.
      - name: Gemeindeschlüssel der Programme prüfen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:ags

      # Der zweite Seiten-Abgleich: dieselbe Frage wie oben, nur für die Seiten,
      # die wir KENNEN, aber (noch) nicht führen. Er ist der Auslöser dafür, dass
      # eine Gemeinde erneut eingeordnet wird.
      #
      # WARUM NICHT EINFACH EIN INTERVALL (18.08.2026): Weil „alle 90 Tage" heißt,
      # dass ein Programm bis zu 89 Tage den falschen Status tragen kann. Die
      # richtige Größe ist nicht das Alter, sondern ob die Seite sich BEWEGT hat —
      # dieselbe Einsicht, die schon die 180-Tage-Frist beim Beleg-Verfall
      # gekippt hat. Bewegt sich ein Fingerabdruck, steht die Gemeinde im
      # Screening-Schritt darunter am selben Tag wieder oben.
      - name: Bekannte Förderseiten auf Bewegung prüfen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:seiten -- --limit 3000

      # Dasselbe je EINZELNER Seite statt einer je Gemeinde (19.08.2026). Der
      # Schritt darüber prüft `funding_coverage`, und die Tabelle kennt je
      # Gemeinde genau eine Adresse — eine Stadt mit getrennter Photovoltaik- und
      # Balkonseite bekam eine davon geprüft und die andere nie. „Status ist
      # aktuell" stimmte damit immer nur für eine Seite pro Ort.
      #
      # Er schreibt zusätzlich den Zustand mit: Eine Seite, die nicht mehr
      # antwortet, ist kein stiller Ausfall, sondern ein Befund. Ohne das Feld
      # stünde eine tote Adresse unbegrenzt als gültige Fundstelle im Bestand.
      # DER SCHRITT HAT EIN EIGENES ZEITLIMIT — und das ist der wichtigere Teil
      # dieser Zeilen (23.08.2026). Vier Läufe in Folge (20.–23.08.) endeten hier
      # mit „cancelled": Der Bestand war von 2.672 auf 6.922 Seiten gewachsen,
      # das Pensum von 3.000 passte nicht mehr in die Restzeit, und weil der Job
      # nur EIN Limit für alle Schritte hatte, riss dieser Schritt die
      # nachfolgenden mit. Ausgefallen sind vier Tage lang die
      # Technik-Einordnung, das Screening und die Leseliste — also genau die
      # Arbeit an der Katalog-Vollständigkeit.
      #
      # Sichtbar war das fast nicht: „cancelled" liest sich als „egal", nicht als
      # „rot". Der Tagesbericht lief (`if: always()`) und trug den Beweis sogar
      # bei sich — dreimal „unverändert" in Folge bei genau den Zahlen, die diese
      # Schritte bewegen —, aber „unverändert" ist auch das Normalergebnis.
      #
      # Deshalb zwei Bremsen statt einer neuen Zahl:
      #  · `timeout-minutes` hier begrenzt den Schaden strukturell. Der Bestand
      #    wächst um mehrere hundert Seiten am Tag; jede feste Pensumszahl wird
      #    also irgendwann wieder zu groß, und dann darf sie nur SICH SELBST
      #    abschneiden.
      #  · `continue-on-error`, weil ein abgeschnittener Schub hier kein Fehler
      #    ist, sondern die Bauart: Das Skript nimmt die am längsten nicht
      #    gesehenen Seiten zuerst, jede kommt reihum dran. Was heute nicht mehr
      #    passt, steht morgen oben.
      #
      # Das Pensum geht auf 1.500 — halbe Last bei anderthalbfacher Zeit. Die
      # Zahl ist NICHT aus einem gemessenen Durchsatz abgeleitet: Der Schritt
      # wurde jedes Mal abgebrochen, bevor er eine Zwischenzahl meldete, und ein
      # Trockenlauf braucht Zugangsdaten, die in der Worktree nicht liegen. Sie
      # ist aus dem Zeitbudget gegriffen und darf beim nächsten grünen Lauf
      # gegen die dann gemeldeten Zahlen korrigiert werden — dass sie zu grob
      # ist, kostet nichts, weil ein zu großes Pensum jetzt nur noch sich selbst
      # abschneidet.
      #
      # Was hier NICHT dranhängt: die 14-Tage-Frist der Katalogprogramme. Deren
      # Bestätigung bedient der Schritt darüber (`foerder:seiten`), und der
      # bleibt ohne Limit und ohne continue-on-error — wenn DER nicht durchläuft,
      # soll der Lauf rot werden.
      - name: Jede einzelne Förderseite auf Bewegung prüfen
        timeout-minutes: 12
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:seiten-alle -- --limit 1500

      # Welche Technik trägt die Seite? Ohne diese Angabe ist die eigentliche
      # Frage unbeantwortbar: „Haben wir für DIESE Gemeinde eine
      # Wärmepumpen-Seite?" Gemessen am 19.08.2026 trugen 149 von 2.672 Seiten
      # eine Technik; der Rest war eine Adresse ohne Aussage.
      #
      # Er benutzt denselben Erkenner wie das Screening — ein zweiter wäre eine
      # zweite Wahrheit. Und nur ein TREFFER setzt eine Technik: Eine Seite, die
      # die Wärmepumpe bloß erwähnt, ohne dass in Reichweite Geld steht, ist
      # keine Wärmepumpen-Förderseite.
      - name: Technik je Förderseite einordnen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:technik -- --limit 800

      # Zum Schluss ein Bericht — sonst stehen die Zahlen der vier Läufe nur im
      # Protokoll dieses Workflows, und das liest niemand. Ein Automatismus,
      # dessen Ergebnis nirgends ankommt, ist von einem stillstehenden nicht zu
      # unterscheiden; genau daran ist die Urlaubswoche im August aufgefallen.
      #
      # Die Schleuse bleibt, wie sie ist: Der Bericht landet in der Ablage
      # (/admin/waechter) und wird NUR zugestellt, wenn er eine Entscheidung
      # enthält, die dem Betreiber gehört. Fortschrittszahlen sind keine.
      - name: Tagesbericht der Erfassung
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run foerder:bericht

      # Der Katalog soll vollständig werden, nicht stichprobenhaft. Der Bestand
      # wächst jetzt aus zwei Quellen: den Adressen des Kommunen-Outreach und dem
      # Schritt darüber. Unerreichbare Seiten kommen von selbst wieder dran, und
      # nach einer Änderung der Erkennung auch die längst abgehakten. Der Schub
      # liegt über dem, was der Suchschritt je Lauf an neuen Adressen liefert
      # (gemessen gut hundert) — sonst wächst der Rückstand schneller, als er
      # abgetragen wird.
      - name: Abdeckung weiter durchsehen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run foerder:screen -- --limit 250

      # Nach Technik getrennt, weil die Treffer in drei verschiedene Rechner
      # führen und drei verschiedene Leselisten sind.
      - name: Treffer zum Nachlesen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm run foerder:screen -- --treffer --technik balkon
          npm run foerder:screen -- --treffer --technik waermepumpe
          npm run foerder:screen -- --treffer --technik pv
