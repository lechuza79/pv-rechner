name: Health Check

# Misst alle 3 Stunden, was ein echter Besucher auf solar-check.io erlebt:
# Statuscodes, Antwortzeiten und vor allem den ABSTAND ZUR NOTBREMSE beim
# frischen Aufbau einer Atlas-Gemeindeseite.
#
# Warum GitHub Actions und nicht ein Wächter in der App: Der Ausfall vom
# 24.–26.07.2026 lief zwei Tage unbemerkt. Ein Monitoring, das nur läuft wenn
# jemand ein Programm offen hat, hätte ihn genauso verpasst. Dieser Workflow
# runs independently of the desktop. Only new escalations fail the job;
# repeated findings remain visible in the summary and trigger the repair lane.
#
# Warum alle 3 Stunden und nicht öfter: Der Schaden wächst hier über Tage, nicht
# über Minuten. Häufiger würde nur unnötig Last auf die Datenbank geben — jeder
# Kaltaufbau kostet echte Datenbank-Reads.

on:
  schedule:
    - cron: "17 */3 * * *"
  # Nach jedem Deploy auf main: fängt eine Regression am selben Tag statt beim
  # nächsten Zufallstreffer. Genau die Lücke, durch die der Juli-Ausfall fiel —
  # zwischen der letzten Messung (21.07.) und dem Ausfall lagen ein Dutzend
  # ungemessene Atlas-Änderungen.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "components/**"
      - "vercel.json"
      - "next.config.js"
      - "scripts/health-*.ts"
      - "scripts/autofix-budget.ts"
      - ".github/workflows/health-check.yml"
      - ".github/workflows/claude-autofix.yml"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Initialize incident history explicitly (first installation only)"
        type: boolean
        default: false

# Schreibrecht, damit der Check die Function-Region selbst zurücksetzen kann —
# der einzige Befund mit genau einer richtigen Antwort. Alles Mehrdeutige wird
# nur gemeldet, nie automatisch geändert.
permissions:
  contents: write
  # Lesen der eigenen Lauf-Historie (siehe GITHUB_TOKEN unten).
  actions: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Für die Kostenwache: Ohne dieses Geheimnis kann sie die Tagesmengen
      # weder erfassen noch beurteilen — und sie sagt das dann auch so, statt
      # „in Ordnung" zu melden. Die Protokolle werden nur einen Tag aufbewahrt,
      # ein verpasster Tag ist für immer verpasst.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Damit der Check die eigene Lauf-Historie lesen kann: Ein roter Lauf geht
      # an die Autofix-Action, nicht an den Betreiber — erst wenn mehrere Läufe
      # hintereinander an derselben Stelle rot bleiben, wird daraus eine Frage
      # an ihn. Ohne Token wird nie eskaliert (im Zweifel keine Mail).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      HEALTH_INCIDENTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bei einem Push erst kurz warten — sonst misst der Check noch das alte
      # Deployment und eine frische Regression bliebe unentdeckt.
      - name: Auf Deployment warten
        if: github.event_name == 'push'
        run: sleep 180

      - name: Vorfallhistorie laden
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            node --import tsx scripts/health-history.ts --bootstrap
          else
            node --import tsx scripts/health-history.ts
          fi

      - name: Gesundheitscheck
        id: check
        run: npm run health-check -- --alert

      # Persist BEFORE failing the escalation step, including failed runs.
      - name: Vorfälle und Messbefund sichern
        uses: actions/upload-artifact@v4
        with:
          name: health-incidents
          overwrite: true
          path: |
            .health/state.json
            .health/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Selbstheilung ausliefern
        if: steps.check.outputs.healed == 'true'
        run: |
          git config user.name "solar-check health-check"
          git config user.email "noreply@solar-check.io"
          git add vercel.json
          git commit -m "Selbstheilung: Function-Region auf fra1 zurueckgesetzt

          Der Gesundheitscheck hat gemessen, dass die Serverless-Functions
          nicht mehr in Frankfurt laufen, und den fehlenden regions-Eintrag in
          vercel.json wieder gesetzt. Die Datenbank steht in eu-central-1 —
          aus einer anderen Region kostet jeder DB-Roundtrip Atlantik-Latenz
          und der Atlas laeuft in den 8-s-Fast-Fail (Vorfall 24.-26.07.2026,
          siehe lib/db-timeout.ts).

          Automatisch erzeugt. Nur diese eine Einstellung wird selbst
          korrigiert — sie hat genau eine richtige Antwort."
          git push

      - name: Neue Eskalation
        if: steps.check.outputs.escalate == 'true'
        run: |
          echo "::error::Neuer oder anhaltender Vorfall eskaliert. Details und Erholungen im Messbericht."
          exit 1
