# Nächtlicher Flow-Lauf: wirklich JEDE Kombination durch jeden Flow.
#
# Warum zwei Läufe (Vorgabe des Betreibers, 18.08.2026: „der test sollte
# möglichst alle kombinationen testen um fehler zu bemerken bevor es ein
# nutzer tut"):
#
#   - Bei jedem Push läuft der schnelle Läufer (ci.yml, Job „flows"): jede
#     Option jedes Schritts, jeder Zweig — fängt kaputte Knöpfe und
#     gebrochene Wege in Minuten, bevor der Push durch ist.
#   - Hier, einmal pro Nacht, läuft derselbe Läufer OHNE die Abkürzung
#     (FLOW_ALLE_KOMBINATIONEN=1): 3.462 Wege über sieben Flows.
#     Auf jedem Push wäre das unhaltbar — und unter Parallellast produzierte
#     genau diese Menge am 18.08.2026 Fehlalarme („Option ließ sich nicht
#     wählen" auf einem Doku-Commit). Nachts, mit einem Arbeiter je Flow und
#     ohne Zeitdruck, ist sie tragbar.
#
# JE FLOW EIN EIGENER JOB (07.09.2026) — die Verteilung hat es verlangt.
# Vorher liefen alle Flows nacheinander in einem Job und standen bei 258 von
# 280 erlaubten Minuten; am 05.09. riss der Lauf das Limit. WELCHER Flow die
# Zeit frisst, stand nirgends, und genau das war der Blocker. Gemessen in der
# Nacht zum 06.09.2026, aus den Startzeitpunkten der einzelnen Tests:
#
#   PV-Rechner              1.728 Wege   149 min   58 %
#   Wärmepumpen-Rechner     1.120 Wege    71 min   28 %
#   PV-Bedarf / Empfehlung    288 Wege    24 min    9 %
#   Klimaanlagen-Rechner      144 Wege     5 min
#   Förder-Check Frankfurt     90 Wege     3 min
#   Einspeisevergütung         60 Wege     3 min
#   Balkonkraftwerk-Rechner    32 Wege     1 min
#
# Zwei Flows tragen 86 % der Zeit. Getrennte Jobs machen daraus einen längsten
# von rund 150 Minuten, OHNE einen einzigen Weg weniger zu prüfen.
#
# UND ES IST NICHT DASSELBE WIE MEHR ARBEITER: Parallele Arbeiter teilen sich
# einen Server, und genau daraus entstanden die Fehlalarme vom 18.08.2026.
# Getrennte Jobs teilen nichts — jeder baut und startet seinen eigenen Server
# und bleibt bei `--workers=1`.
#
# Ein roter Lauf hier ist ein echter Befund in einer Kombination, die der
# schnelle Läufer nicht geht — die tägliche Triage liest ihn wie jeden
# anderen Action-Lauf.

name: Flows nightly (alle Kombinationen)

on:
  schedule:
    # 02:30 UTC — nach Mitternacht in Deutschland, vor dem Morgen-Traffic.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  # Die Aufteilung wird ABGELEITET, nicht getippt. Eine Liste der Flow-Namen in
  # dieser Datei wäre eine zweite Wahrheit neben `FLOWS` in e2e/flows.ts: Sie
  # driftet beim ersten umbenannten Flow, und ein Job mit einem veralteten Namen
  # liefe auf NULL Tests — grün, ohne etwas geprüft zu haben.
  #
  # Deshalb prüft derselbe Schritt zusätzlich gegen Playwright, dass jeder Job
  # mindestens einen Test bekommt und alle Jobs zusammen den ganzen Bestand
  # genau einmal abdecken. Er wird rot, bevor die Nacht stumm weniger prüft.
  aufteilung:
    name: Aufteilung bestimmen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Aufteilung ableiten und gegenprüfen
        id: matrix
        run: |
          npx tsx scripts/flow-matrix.ts --pruefen
          echo "jobs=$(npx tsx scripts/flow-matrix.ts)" >> "$GITHUB_OUTPUT"

  flows-alle:
    name: ${{ matrix.job.name }}
    needs: aufteilung
    runs-on: ubuntu-latest
    # 220 statt der früheren 300: Der längste Job ist heute der PV-Rechner mit
    # 149 Minuten. Das Job-Limit muss über der SUMME seiner Schritt-Limits
    # liegen (10 + 5 + 200 = 215), sonst reißt wieder der Job zuerst und der
    # Ausgang heißt „cancelled" statt „failure" — festgenagelt von
    # lib/__tests__/workflow-schritt-zeitlimits.test.ts.
    timeout-minutes: 220

    strategy:
      # Ein gerissener Flow darf die anderen nicht abwürgen: Sie endeten sonst
      # „cancelled", und das liest sich als „egal" statt als „nicht geprüft".
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.aufteilung.outputs.jobs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Browser-Binaries: reiner Download von Playwrights CDN, kein apt.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium

      # Systembibliotheken — der einzige Schritt, der `apt-get` benutzt, und
      # damit der einzige, der an fremder Infrastruktur hängt. Dreimal in 18
      # Stunden (18./19.08.2026) blieb er am Ubuntu-Spiegel der Runner stehen:
      # einmal 35 Minuten bis zum Job-Abbruch, danach zweimal bis in die
      # 10-Minuten-Grenze — jedes Mal rot, ohne dass an unserem Code etwas war.
      #
      # Deshalb ist er ABSICHTLICH NICHT MEHR FATAL: Das Runner-Image bringt die
      # Chromium-Bibliotheken bereits mit, der Schritt ist eine Absicherung, kein
      # Fundament. Fällt er aus, läuft der Lauf weiter — und falls doch eine
      # Bibliothek fehlt, scheitert der Testschritt danach mit einer klaren
      # Browser-Meldung statt mit einem apt-Protokoll. Rot bedeutet damit wieder
      # „unser Code ist kaputt", und genau das ist der Sinn der Ampel.
      - name: Install Playwright system deps (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # Schritt-Zeitlimit UNTER dem Job-Limit — der Unterschied ist die Ampel:
      # Ein gerissenes JOB-Limit endet „cancelled" und faellt erst nach drei
      # erfolglosen Naechten auf (`laufStumm`), ein gerissenes SCHRITT-Limit
      # endet „failure" und ist am naechsten Morgen rot zu sehen.
      #
      # 200 Minuten fuer den laengsten Flow (PV-Rechner, 149 min gemessen) —
      # ein Drittel Luft. Vorher waren es 8 %, und der Lauf ist genau daran
      # gerissen. DAS IST KEIN ANGEHOBENES LIMIT: Die Gesamtzeit des Laufs
      # sinkt von 258 auf rund 150 Minuten, weil sechs Flows daneben laufen
      # statt danach. Ein blosses Hochsetzen waere der Zug, den das
      # Waechter-Gate verbietet.
      #
      # Die BERICHTSFORM „github,line" bleibt (05.09.2026): „github" schreibt in
      # die Annotationen, „line" nennt jeden Test beim Namen, sobald er startet.
      # Aus diesen Startzeitpunkten stammt die Verteilung oben — ohne sie waere
      # die Aufteilung geraten gewesen.
      - name: Flow walker, alle Kombinationen (production build)
        timeout-minutes: 200
        # Auswahl über zwei Umgebungsvariablen, NICHT als interpolierte Zeile:
        # Der Ausdruck enthält selbst Anführungszeichen, und die dann noch der
        # Shell zu überlassen wäre eine Quotierungs-Aufgabe, die niemand im Kopf
        # nachrechnen kann. Zwei Variablen haben das Problem gar nicht.
        run: npm run test:flows -- --reporter=github,line "$FLOW_FLAG" "$FLOW_MUSTER"
        env:
          FLOW_FLAG: ${{ matrix.job.flag }}
          FLOW_MUSTER: ${{ matrix.job.muster }}
          FLOW_ALLE_KOMBINATIONEN: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder-not-used-in-flow-run
          # Der Produktionsbau rendert die Seiten vor und liest dafür dieselben
          # Daten wie der Gesundheitscheck — ohne echte Leserechte bricht schon
          # der Build ab (Atlas, Förderseiten, Ratgeber).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # GEMESSEN 27.08.2026: Dieser Schritt hat noch NIE etwas hochgeladen. Im
      # roten Lauf 32966743790 stand woertlich „No files were found with the
      # provided path: playwright-report/" — und zwei Zeilen darueber im selben
      # Log eine Ablaufverfolgung unter `test-results/.../trace.zip`, die damit
      # niemand bekommen hat.
      #
      # Der Grund ist die Berichtsform: Im CI steht der Reporter auf „github"
      # (playwright.config.ts), und der schreibt seine Ausgabe in die Annotationen
      # des Laufs, nicht in einen Ordner `playwright-report/`. Den gibt es nur mit
      # dem HTML-Reporter. Was bei einem Fehlschlag WIRKLICH entsteht, ist die
      # Ablaufverfolgung des Wiederholungslaufs (`trace: "on-first-retry"`), und
      # die liegt in Playwrights Standard-Ausgabeordner `test-results/`.
      #
      # Bewusst NICHT `if: always()`: Bei gruenem Lauf entsteht dort nichts, und
      # ein Abbruch mitten im Testschritt hinterlaesst ebenfalls nichts —
      # Playwright schreibt die Verfolgung erst beim Abschluss eines Versuchs.
      # Gegen einen Abbruch hilft das Schritt-Zeitlimit oben, nicht der Upload.
      #
      # Der Name traegt die Job-Nummer: Bei einer Matrix kollidieren sonst alle
      # Jobs auf demselben Artefaktnamen, und der zweite Upload schlaegt fehl.
      - name: Upload Playwright-Ablaufverfolgung
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-flows-nightly-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
