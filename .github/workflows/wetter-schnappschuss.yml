name: Live-Wetter-Schnappschuss (DWD ICON-D2)

# Schreibt stündlich je Postleitzahl-Bereich eine kleine Datei mit dem
# Wettermodell ICON-D2 für die Stunden um „jetzt" (scripts/icon-d2-snapshot.ts →
# Supabase Storage „wetter-modell"). Die Seite liest bei einer Anfrage nur diese
# Datei; das offene Archiv und sein Lesebaustein bleiben hier.
#
# Ein Schnappschuss deckt den ganzen deutschen Kalendertag ab (für die
# Tageskurven der Live-Simulation und „Solarleistung heute") und mindestens
# vier Stunden voraus. Verspätet sich ein Lauf (GitHub hält geplante Läufe zu
# Stoßzeiten zurück) oder fällt einer aus, trägt der vorige also noch einige
# Stunden; nach Mitternacht fehlt der neue Tag — dann zeigt die Seite kein
# Modellwetter mehr, sie erfindet keins.

# GitHub starts the hourly schedule only every four to eight hours; the
# reliable hourly start comes from a Vercel cron (/api/wetter/anstossen, minute
# 5). The schedule below stays as the fallback if that route ever fails.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wetter-schnappschuss
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # One retry after five minutes: the open archive is occasionally mid-write
      # when a new model run lands (07.10.2026 01:35 UTC: every postcode had a
      # gap, the same read at 06:40 was complete). The script still refuses to
      # write a snapshot with holes; the retry only gives the archive time.
      - name: Schnappschuss schreiben
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run wetter:schnappschuss -- --auch-lokal || (sleep 300 && npm run wetter:schnappschuss -- --auch-lokal)

      # Tageskurve "Solarleistung heute" für die 16 Länder und Deutschland
      # (lib/region-solar-day.ts): liest die eben geschriebenen Wetterdateien
      # von der Platte, ruft keinen Wetterdienst, schreibt eine Datei.
      - name: Länder- und Deutschland-Tageskurve
        timeout-minutes: 8
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEATHER_SNAPSHOT_DIR: scripts/.cache/icon-d2
        run: npm run wetter:regionen
