name: Product catalogues
on:
  schedule:
    - cron: "43 0,6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-catalogues
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Both catalogues on every run. The heat-pump import used to run only on
        # the 06:43 schedule; GitHub starts that run six to nine hours late, so a
        # merchant feed that resumed in the morning (after the 03.10 holiday
        # weekend) reached the page only the next afternoon, while the page hides
        # device cards once the merchant timestamp is older than three days.
        # The import takes ~15 s, so four runs a day cost nothing worth saving.
        catalog: ["wp", "bkw"]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      AWIN_FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Import and verify, retry once on failure
        env:
          CATALOG: ${{ matrix.catalog }}
        run: |
          for attempt in 1 2; do
            if npm run "$CATALOG:katalog"; then
              echo "$CATALOG: import and read-back verified" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" = "1" ]; then sleep 20; fi
          done
          echo "::error::Catalogue import failed twice; last complete catalogue is retained."
          exit 1
